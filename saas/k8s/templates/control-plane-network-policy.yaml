# Gateway Proxy Network Policy
# Controls traffic to/from the gateway proxy in the control plane
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway-proxy-policy
  namespace: moltbot-saas
  labels:
    app: gateway-proxy
    managed-by: moltbot-saas
spec:
  podSelector:
    matchLabels:
      app: gateway-proxy
  policyTypes:
    - Ingress
    - Egress

  ingress:
    # Allow from ingress controller (external traffic)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 3001

    # Allow from API server for health checks
    - from:
        - podSelector:
            matchLabels:
              app: moltbot-api
      ports:
        - protocol: TCP
          port: 3001

  egress:
    # Allow DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

    # Allow connections to tenant namespaces
    - to:
        - namespaceSelector:
            matchLabels:
              tenant-type: moltbot-tenant
      ports:
        - protocol: TCP
          port: 18789

    # Allow connections to PostgreSQL
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432
---
# API Server Network Policy
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-server-policy
  namespace: moltbot-saas
  labels:
    app: moltbot-api
    managed-by: moltbot-saas
spec:
  podSelector:
    matchLabels:
      app: moltbot-api
  policyTypes:
    - Ingress
    - Egress

  ingress:
    # Allow from ingress controller
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 3000

  egress:
    # Allow DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

    # Allow PostgreSQL
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432

    # Allow Vault
    - to:
        - podSelector:
            matchLabels:
              app: vault
      ports:
        - protocol: TCP
          port: 8200

    # Allow gateway proxy
    - to:
        - podSelector:
            matchLabels:
              app: gateway-proxy
      ports:
        - protocol: TCP
          port: 3001

    # Allow Kubernetes API for orchestration
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
