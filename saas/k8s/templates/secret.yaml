apiVersion: v1
kind: Secret
metadata:
  name: moltbot-secrets
  namespace: "{{namespace}}"
  labels:
    app: moltbot-tenant
    tenant-id: "{{tenantId}}"
type: Opaque
data:
  # Base64-encoded values injected at runtime
  encryption-key: "{{encryptionKeyBase64}}"
  gateway-token: "{{gatewayTokenBase64}}"
