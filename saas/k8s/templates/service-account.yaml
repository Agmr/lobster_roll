apiVersion: v1
kind: ServiceAccount
metadata:
  name: moltbot-agent
  namespace: "{{namespace}}"
  labels:
    app: moltbot-tenant
    tenant-id: "{{tenantId}}"
---
# Minimal RBAC - agent doesn't need any cluster permissions
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: moltbot-agent
  namespace: "{{namespace}}"
rules: []  # No permissions needed
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: moltbot-agent
  namespace: "{{namespace}}"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: moltbot-agent
subjects:
  - kind: ServiceAccount
    name: moltbot-agent
    namespace: "{{namespace}}"
